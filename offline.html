<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#8c2a34"><title>GSTF – hors connexion</title>
<style>
:root{--accent:#8c2a34;--gold:#c4932a;--ink:#262a33;--muted:#6b7080;--line:#e2e3ea;--bg:#f4f4f7;--surface:#fff}
@media (prefers-color-scheme:dark){:root{--accent:#e58a95;--gold:#e0b65a;--ink:#ecebf0;--muted:#a4a2ad;--line:#33303a;--bg:#16151a;--surface:#1f1d24}}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);padding-bottom:env(safe-area-inset-bottom)}
header{background:#8c2a34;color:#fff;padding:calc(18px + env(safe-area-inset-top)) 18px 18px;display:flex;align-items:center;gap:12px}
header img{width:46px;height:46px;border-radius:50%;background:#fff;padding:3px}header b{font-family:Georgia,serif;font-size:18px;display:block}header small{opacity:.85}
.etat{margin:14px;padding:12px 14px;border-radius:10px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;gap:10px;justify-content:space-between}
.etat p{margin:0;font-size:14px}button{background:#8c2a34;color:#fff;border:0;border-radius:999px;padding:10px 18px;font-size:15px;font-weight:600}
.onglets{display:flex;gap:8px;margin:0 14px}.onglets button{flex:1;background:var(--surface);color:var(--ink);border:1px solid var(--line)}.onglets button[aria-pressed=true]{background:#8c2a34;color:#fff;border-color:#8c2a34}
section{margin:14px}h2{font-family:Georgia,serif;font-size:20px;margin:6px 0 10px}
.priere{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:10px;padding:14px 16px;margin-bottom:12px}
.priere h3{margin:0 0 8px;font-family:Georgia,serif;font-size:18px;color:var(--accent)}.priere p{margin:0;white-space:pre-line;line-height:1.55;font-size:15.5px}
.vide{color:var(--muted);font-size:15px;line-height:1.5}.carte-zone{display:flex;justify-content:center;overflow:auto;padding:6px 0}.carte-zone .ce{transform-origin:top center}
.actu{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:12px}.actu img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}.actu div{padding:12px 14px}.actu small{color:var(--muted)}.actu h3{margin:4px 0 6px;font-family:Georgia,serif;font-size:18px}.actu p{margin:0;white-space:pre-line;line-height:1.5;font-size:15px}.onglets button{padding:10px 6px;font-size:14px}
.note{font-size:12.5px;color:var(--muted);text-align:center;margin-top:8px}
</style><style id="carteCss"></style></head>
<body>
<header><img src="/icon-192.png" alt=""><div><b>Grand Séminaire de Théologie</b><small>Sainte Thérèse de l’Enfant-Jésus · Faliarivo</small></div></header>
<div class="etat"><p><b>Pas de connexion Internet.</b><br><span lang="mg">Tsy misy aterineto.</span></p><button onclick="location.reload()">Réessayer</button></div>
<div class="onglets"><button type="button" data-o="actus" aria-pressed="false">📰 Actualités</button><button type="button" data-o="carte" aria-pressed="false">🪪 Ma carte</button><button type="button" data-o="prieres" aria-pressed="false">🙏 Prières</button></div>
<section id="o-actus" hidden></section>
<section id="o-carte" hidden></section>
<section id="o-prieres" hidden></section>
<script>
(function () {
  function lire(k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } }
  function esc(s) { return String(s || '').replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  var carte = lire('gstf-ma-carte'), prieres = lire('gstf-prieres'), actus = lire('gstf-actus');
  var c = document.getElementById('o-carte');
  if (carte && carte.html) {
    document.getElementById('carteCss').textContent = carte.css || '';
    c.innerHTML = '<h2>Ma carte d’étudiant</h2><div class="carte-zone"><div style="zoom:' + (window.innerWidth < 420 ? 1.15 : 1.5) + '">' + carte.html + '</div></div><p class="note">Enregistrée sur ce téléphone le ' + esc(new Date(carte.maj).toLocaleDateString('fr-FR')) + '. Le QR code se vérifie en ligne.</p>';
  } else c.innerHTML = '<h2>Ma carte d’étudiant</h2><p class="vide">Votre carte n’est pas encore enregistrée sur ce téléphone. Avec Internet, connectez-vous une fois et ouvrez « Ma carte d’étudiant » dans votre portail : elle restera ensuite disponible ici, même sans connexion.</p>';
  var p = document.getElementById('o-prieres'), l = prieres && prieres.liste;
  p.innerHTML = '<h2>Prières du séminaire</h2>' + (l && l.length ? l.map(function (x) { return '<div class="priere"><h3>' + esc(x.titre) + '</h3><p>' + esc(x.texte) + '</p></div>'; }).join('')
    : '<p class="vide">Ouvrez une fois l’onglet « Prières » avec Internet : elles resteront ensuite disponibles ici.</p>');
  var ac = document.getElementById('o-actus'), la = actus && actus.liste;
  ac.innerHTML = '<h2>Dernières actualités</h2>' + (la && la.length ? la.map(function (x) { return '<article class="actu">' + (x.img ? '<img src="' + x.img + '" alt="">' : '') + '<div><small>' + esc(x.date) + '</small><h3>' + esc(x.titre) + '</h3>' + (x.texte ? '<p>' + esc(x.texte) + '</p>' : '') + (x.video ? '<p style="margin-top:8px;color:var(--muted)">▶ Vidéo à regarder avec Internet</p>' : '') + '</div></article>'; }).join('')
    + '<p class="note">Enregistrées sur ce téléphone le ' + esc(new Date(actus.maj).toLocaleDateString('fr-FR')) + '.</p>'
    : '<p class="vide">Ouvrez une fois l’accueil avec Internet : les dernières actualités resteront ensuite lisibles ici.</p>');
  function aller(o) { document.querySelectorAll('[data-o]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.o === o)); }); c.hidden = o !== 'carte'; p.hidden = o !== 'prieres'; ac.hidden = o !== 'actus'; }
  document.querySelectorAll('[data-o]').forEach(function (b) { b.onclick = function () { aller(b.dataset.o); }; });
  aller(/macarte|monespace/.test(location.hash) ? 'carte' : /prieres|intention/.test(location.hash) ? 'prieres' : 'actus');
  window.addEventListener('online', function () { location.reload(); });
})();
</script></body></html>
